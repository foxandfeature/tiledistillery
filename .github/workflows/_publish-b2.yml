name: Publish to Backblaze B2 (reusable, repo-internal)

# Downloads a merged .pmtiles artifact from a _pipeline.yml run and mirrors
# it to Backblaze B2, gated behind the b2-publish GitHub Environment.
#
# Unlike _pipeline.yml and _publish-release.yml, this workflow is NOT meant
# to be called cross-repo: a reusable workflow's `environment:` resolves
# against the repo owning the *workflow file* (this repo), not the
# caller's, so any repository could reach our real B2 credentials just by
# calling this public file directly. The job's `if:` guard below is the
# actual technical control (blocks the job before it ever reaches the
# environment gate); required-reviewer approval on `b2-publish` itself
# (this repo's own Settings, not this file) is a second layer on top. See
# docs/ARCHITECTURE.md "Publishing".

on:
  workflow_call:
    inputs:
      output_basename:
        description: 'Base filename inside the "<output_basename>-pmtiles" artifact uploaded by a _pipeline.yml run, and the B2 object key it is uploaded under, e.g. "bins" for bins.pmtiles.'
        required: true
        type: string

jobs:
  publish-b2:
    # Blocks any repository other than this one from ever reaching the
    # `environment: b2-publish` line below, closing the credential-leak
    # shape described above at the point the job would otherwise start,
    # not after the fact.
    if: github.repository == 'foxandfeature/tiledistillery'
    runs-on: ubuntu-latest
    environment: b2-publish
    steps:
      - name: Download the merged layer
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.output_basename }}-pmtiles

      - name: Install B2 CLI
        run: pip install "b2>=4,<5"

      - name: Upload to Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: |
          FILE="${OUTPUT_BASENAME}.pmtiles"
          # `b2 account authorize` prints the full account_info JSON on
          # success, including the raw applicationKey and a live
          # accountAuthToken, via `enforce_output=True` in the CLI, which
          # bypasses --quiet. GitHub's secret masking only redacts exact
          # literal matches of declared secrets, so the derived
          # accountAuthToken leaks into the log unless stdout is discarded
          # here. Errors still surface via stderr and the exit code.
          b2 account authorize "$B2_APPLICATION_KEY_ID" "$B2_APPLICATION_KEY" >/dev/null
          b2 file upload "$B2_BUCKET_NAME" "$FILE" "$FILE"

          # `b2 file upload` uploads a new version without hiding the one
          # it replaces, so a "keep only last version" bucket lifecycle
          # rule (which only prunes already-hidden versions) never gets a
          # chance to run and old versions pile up forever. Prune manually,
          # after the new version is live, so the public URL never 404s.
          old_file_ids=$(
            b2 ls --json --versions "b2://$B2_BUCKET_NAME/$FILE" \
              | jq -r 'sort_by(.uploadTimestamp) | .[:-1][].fileId'
          )
          for file_id in $old_file_ids; do
            b2 rm "b2id://$file_id"
          done
