name: TileDistillery pipeline (reusable)

# Builds one or more PMTiles layers from every Geofabrik leaf extract in
# scope, using the caller's own tilemaker config/process files (see
# docs/ARCHITECTURE.md). config/process/output_basename each take one
# value, or a comma-separated list matched 1:1 (e.g. building "bins" and
# "roads" together) — sharing one claim and one .osm.pbf download per
# region across every config in the list, same fetch/build split
# TileAlchemist uses for its own multi-profile runs.
#
# prepare -> build (single claim-loop matrix) -> record-timings (always,
# single writer for the run's whole timing history) -> verify-complete
# (hard gate) -> merge (matrixed per output_basename) -> cleanup (always).
# One round, not two: worker_count is deliberately generous (see
# docs/ARCHITECTURE.md "Distribution") so a worker crashing mid-region or
# hitting its own time wall costs that one region, not a second dispatch —
# every other worker in the same matrix keeps draining the queue regardless
# (`fail-fast: false`). Deliberately does NOT publish anywhere (no GitHub
# Release, no B2 upload) — that's the calling workflow's job, same
# separation as TileAlchemist's _pipeline.yml.
#
# State (claim refs + timing history) lives on the CALLING repo's own
# `state` branch, never in this repo — see docs/ARCHITECTURE.md "State
# lives in the caller's repo, not this one". The caller must grant
# `permissions: contents: write`; this workflow's own `concurrency:` group
# below (keyed by caller repo + output_basename) is what actually prevents
# two overlapping runs of the same build from racing over the same claim
# scope, so the caller does not need its own concurrency group for that.
# Calling this pipeline for "bins,roads" together and calling it separately
# for "bins" alone are different scopes/claim histories — see
# docs/ARCHITECTURE.md "Locking".

on:
  workflow_call:
    inputs:
      config:
        description: 'Path(s), in the caller repo, to tilemaker JSON layer config(s): one value, or a comma-separated list matched 1:1 with process/output_basename.'
        required: true
        type: string
      process:
        description: 'Path(s), in the caller repo, to tilemaker Lua process script(s), matched 1:1 with config/output_basename.'
        required: true
        type: string
      output_basename:
        description: 'Base name(s) for each output .pmtiles file/artifact, matched 1:1 with config/process, e.g. "bins" or "bins,roads". Also the scope key for claims/timing history — see docs/ARCHITECTURE.md "Locking".'
        required: true
        type: string
      attribution:
        description: 'HTML attribution string embedded in every output layer''s PMTiles metadata via tile-join --attribution, applied uniformly across the whole config/process/output_basename list.'
        required: true
        type: string
      worker_count:
        description: 'How many parallel claim-loop workers to fan out into (see docs/ARCHITECTURE.md "Distribution"). Deliberately generous: with one claim-loop round (no topup), headroom here is what absorbs a worker crashing or timing out, since every other worker keeps draining the same queue.'
        required: false
        type: string
        default: "40"
      region_scope:
        description: 'Optional Geofabrik path prefix (e.g. "europe/monaco") to restrict the build to a subtree instead of the whole world.'
        required: false
        type: string
        default: ""

concurrency:
  group: tiledistillery-${{ github.repository }}-${{ inputs.output_basename }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      workers: ${{ steps.gen-workers.outputs.workers }}
      basenames: ${{ steps.gen-basenames.outputs.basenames }}
    steps:
      - name: Validate config/process/output_basename line up 1:1
        env:
          CONFIG: ${{ inputs.config }}
          PROCESS: ${{ inputs.process }}
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: |
          IFS=',' read -ra C <<< "$CONFIG"
          IFS=',' read -ra P <<< "$PROCESS"
          IFS=',' read -ra B <<< "$OUTPUT_BASENAME"
          if [ "${#C[@]}" -ne "${#P[@]}" ] || [ "${#C[@]}" -ne "${#B[@]}" ]; then
            echo "::error::config has ${#C[@]} entries, process has ${#P[@]}, output_basename has ${#B[@]}; must match 1:1"
            exit 1
          fi

      - name: Checkout tiledistillery (this pipeline's own scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      - name: Build the run's queue manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/leaves.py \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}" \
            --region-scope "${{ inputs.region_scope }}" \
            --out queue-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: queue-manifest
          path: queue-manifest.json

      - id: gen-workers
        env:
          WORKER_COUNT: ${{ inputs.worker_count }}
        run: echo "workers=$(python3 -c 'import json, os; print(json.dumps(list(range(int(os.environ["WORKER_COUNT"])))))')" >> "$GITHUB_OUTPUT"

      - id: gen-basenames
        env:
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: echo "basenames=$(python3 -c 'import json, os; print(json.dumps(os.environ["OUTPUT_BASENAME"].split(",")))')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/download-artifact@v4
        with:
          name: queue-manifest

      - uses: ./.tiledistillery/.github/actions/claim-and-build
        with:
          config: ${{ inputs.config }}
          process: ${{ inputs.process }}
          output_basename: ${{ inputs.output_basename }}

      # A worker's whole run can legitimately claim nothing (queue already
      # empty when it started — see claim-and-build's own first-claim step,
      # which skips the tilemaker image pull entirely in that case too), so
      # a missing shard file here is expected, not a failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shards-${{ matrix.worker }}
          path: shards/*.mbtiles
          if-no-files-found: ignore

      # Same "claimed nothing, so no file was ever written" caveat as
      # shards above. See docs/ARCHITECTURE.md "Timing history & queue
      # ordering" and claim-and-build/action.yml: this worker never writes
      # the shared timing-history file itself, only this local buffer —
      # `record-timings` below is the one job that does.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.worker }}
          path: timings-buffer.jsonl
          if-no-files-found: ignore

  # Centralizes timing-history recording into a single writer for the whole
  # run, instead of every worker (or even every worker once) writing the
  # shared state/timings/<output_basename>.json itself — see
  # docs/ARCHITECTURE.md "Timing history & queue ordering" and cmd_done /
  # cmd_flush_timings in scripts/claim.py for why per-writer contention on
  # that file was a real problem, not just a theoretical one. Independent
  # of verify-complete: timing history only feeds *future* runs' queue
  # ordering, never this run's correctness, so it shouldn't gate merge/
  # publish, and runs unconditionally so a run that ultimately fails
  # verify-complete still keeps whatever timing data it produced. `if:
  # always()` also means one failed `build` matrix leg doesn't cost every
  # other, healthy leg's timing data.
  record-timings:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      # Deliberately no merge-multiple: every worker's buffer file shares
      # the same filename (timings-buffer.jsonl), so flattening them into
      # one directory would just overwrite each other. Without
      # merge-multiple, download-artifact keeps each artifact in its own
      # subdirectory named after it, which is all flush-timings needs since
      # it searches --timings-dir recursively.
      - name: Download every worker's timing buffer
        uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: timings
          if-no-artifact-found: ignore

      - name: Merge into shared timing history (one write for the whole run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/claim.py flush-timings \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}" \
            --timings-dir timings

  # The hard gate — completeness is a property of *regions*, which are
  # claimed once per call, not per output_basename (see docs/ARCHITECTURE.md
  # "Locking"). Fails loudly rather than letting `merge` silently publish a
  # world layer with holes in it (see docs/ARCHITECTURE.md "Merge"). `if:
  # always()` so this still runs (and correctly reports/fails) even when one
  # or more `build` matrix legs failed at the job level — every worker that
  # did finish has already recorded its claims on the state branch
  # regardless of a sibling leg's own outcome.
  verify-complete:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: queue-manifest

      - name: Confirm every region is done or permanently failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/finalize_check.py \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}" \
            --manifest queue-manifest.json --fail-if-incomplete

  # One flat merge per output_basename, deliberately not staged by
  # continent — see docs/ARCHITECTURE.md "Merge". Each worker already
  # wrote its shards as "<region>--<output_basename>.mbtiles" (see
  # claim-and-build), so this only needs to glob for its own matrix cell's
  # basename among every downloaded shard, shared across every layer built
  # in this call.
  merge:
    needs: [prepare, verify-complete]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        basename: ${{ fromJson(needs.prepare.outputs.basenames) }}
    steps:
      - name: Download every worker's shards, every layer
        uses: actions/download-artifact@v4
        with:
          pattern: shards-*
          path: shards
          merge-multiple: true

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe || {
            git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -C /tmp/tippecanoe -j"$(nproc)"
            sudo make -C /tmp/tippecanoe install
          }

      - name: Merge this layer's shards into its final file
        env:
          ATTRIBUTION: ${{ inputs.attribution }}
          BASENAME: ${{ matrix.basename }}
        run: |
          tile-join --no-tile-size-limit \
            --attribution="$ATTRIBUTION" \
            -o "${BASENAME}.pmtiles" shards/*--"${BASENAME}".mbtiles

      - name: Summarize
        env:
          BASENAME: ${{ matrix.basename }}
        run: |
          SHARD_COUNT=$(find shards -name "*--${BASENAME}.mbtiles" | wc -l | tr -d ' ')
          SIZE=$(du -h "${BASENAME}.pmtiles" | cut -f1)
          {
            echo "### ${BASENAME} layer"
            echo "- shards merged: $SHARD_COUNT"
            echo "- output size: $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.basename }}-pmtiles
          path: ${{ matrix.basename }}.pmtiles

  cleanup:
    needs: [verify-complete, merge, record-timings]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      - name: Delete every claim ref from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/cleanup_claims.py \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --output-basename "${{ inputs.output_basename }}"
