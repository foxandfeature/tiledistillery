name: TileDistillery pipeline (reusable)

# Builds one or more PMTiles layers from every Geofabrik leaf extract in
# scope, using the caller's own tilemaker config/process files. See
# docs/ARCHITECTURE.md for the full design (region detection, distribution,
# locking, timing history, multi-layer builds, merge). Deliberately does
# NOT publish anywhere (no GitHub Release, no B2 upload); that's the
# calling workflow's job.
#
# Job graph: prepare -> build (single claim-loop matrix) -> record-timings
# (always; single writer, also releases every claimed region's lock) ->
# verify-complete (hard gate) -> cleanup (always), with merge (matrixed per
# output_basename) branching off verify-complete in parallel. cleanup only
# waits on verify-complete, not merge, since merge never touches claim state.
#
# State (queue/claim state + timing history) lives on the CALLING repo's
# own `state` branch, never in this repo. See docs/ARCHITECTURE.md "State
# lives in the caller's repo, not this one". The caller must grant
# `permissions: contents: write`; this workflow's own `concurrency:` group
# below (keyed by caller repo + output_basename) is what prevents two
# overlapping runs of the same build from racing over the same claim scope.

on:
  workflow_call:
    inputs:
      config:
        description: 'Path(s), in the caller repo, to tilemaker JSON layer config(s): one value, or a comma-separated list matched 1:1 with process/output_basename.'
        required: true
        type: string
      process:
        description: 'Path(s), in the caller repo, to tilemaker Lua process script(s), matched 1:1 with config/output_basename.'
        required: true
        type: string
      output_basename:
        description: 'Base name(s) for each output .pmtiles file/artifact, matched 1:1 with config/process, e.g. "bins" or "bins,roads". Also the scope key for claims/timing history. See docs/ARCHITECTURE.md "Locking".'
        required: true
        type: string
      attribution:
        description: 'HTML attribution string embedded in every output layer''s PMTiles metadata via tile-join --attribution, applied uniformly across the whole config/process/output_basename list.'
        required: true
        type: string
      worker_count:
        description: 'How many parallel claim-loop workers to fan out into (see docs/ARCHITECTURE.md "Distribution"). With one claim-loop round (no topup), fail-fast: false is what absorbs a worker crashing or timing out, so every other worker keeps draining the same queue.'
        required: false
        type: string
        default: "20"
      region_scope:
        description: 'Optional Geofabrik path prefix (e.g. "europe/monaco") to restrict the build to a subtree instead of the whole world.'
        required: false
        type: string
        default: ""

concurrency:
  group: tiledistillery-${{ github.repository }}-${{ inputs.output_basename }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      workers: ${{ steps.gen-workers.outputs.workers }}
      basenames: ${{ steps.gen-basenames.outputs.basenames }}
    steps:
      - name: Validate config/process/output_basename line up 1:1
        env:
          CONFIG: ${{ inputs.config }}
          PROCESS: ${{ inputs.process }}
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: |
          IFS=',' read -ra C <<< "$CONFIG"
          IFS=',' read -ra P <<< "$PROCESS"
          IFS=',' read -ra B <<< "$OUTPUT_BASENAME"
          if [ "${#C[@]}" -ne "${#P[@]}" ] || [ "${#C[@]}" -ne "${#B[@]}" ]; then
            echo "::error::config has ${#C[@]} entries, process has ${#P[@]}, output_basename has ${#B[@]}; must match 1:1"
            exit 1
          fi

      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      # Seeds state/queue/<scope>.json directly on the state branch. See
      # docs/ARCHITECTURE.md "Locking".
      - name: Seed queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/leaves.py \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}" \
            --region-scope "${{ inputs.region_scope }}"

      - id: gen-workers
        env:
          WORKER_COUNT: ${{ inputs.worker_count }}
        run: echo "workers=$(python3 -c 'import json, os; print(json.dumps(list(range(int(os.environ["WORKER_COUNT"])))))')" >> "$GITHUB_OUTPUT"

      - id: gen-basenames
        env:
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: echo "basenames=$(python3 -c 'import json, os; print(json.dumps(os.environ["OUTPUT_BASENAME"].split(",")))')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: ./.tiledistillery/.github/actions/claim-and-build
        with:
          config: ${{ inputs.config }}
          process: ${{ inputs.process }}
          output_basename: ${{ inputs.output_basename }}

      # A worker's whole run can legitimately claim nothing (queue already
      # empty when it started, see claim-and-build's own claim loop), so a
      # missing shard file here is expected, not a failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shards-${{ matrix.worker }}
          path: shards/*.mbtiles
          if-no-files-found: ignore

      # Same "claimed nothing, so no file was ever written" caveat as
      # shards above. See docs/ARCHITECTURE.md "Timing history & queue
      # ordering".
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.worker }}
          path: timings-buffer.jsonl
          if-no-files-found: ignore

  # Single writer for timing-history and claim-outcome recording; runs
  # unconditionally so a failed `build` leg doesn't cost the others' data.
  # See docs/ARCHITECTURE.md "Timing history & queue ordering".
  record-timings:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      # No merge-multiple: every buffer shares the filename timings-buffer.jsonl,
      # so flattening would overwrite them. Per-artifact subdirs are fine since
      # flush-timings searches --timings-dir recursively.
      - name: Download every worker's timing buffer
        uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: timings
          if-no-artifact-found: ignore

      - name: Merge into shared timing histor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/claim.py flush-timings \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}" \
            --timings-dir timings

  # The hard gate: fails loudly instead of letting `merge` publish a world
  # layer with holes (docs/ARCHITECTURE.md "Merge"). `if: always()` so a
  # failed `build` leg doesn't skip this check. Needs `record-timings`, not
  # just `build`: that's the job that actually applies buffered claims to
  # the shared queue, so without it every region would still read back as
  # `remaining`.
  verify-complete:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      - name: Confirm every region is done or permanently failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/finalize_check.py \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}" \
            --fail-if-incomplete

  # One flat merge per output_basename, deliberately not staged by continent
  # (docs/ARCHITECTURE.md "Merge"). Shards are named
  # "<region>--<output_basename>.mbtiles", so this just globs for its own
  # matrix cell's basename among all downloaded shards.
  merge:
    needs: verify-complete
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        basename: ${{ fromJson(needs.prepare.outputs.basenames) }}
    steps:
      - name: Download every worker's shards, every layer
        uses: actions/download-artifact@v4
        with:
          pattern: shards-*
          path: shards
          merge-multiple: true

      # Insulates later runs from the apt/Ubuntu-mirror flakiness below
      # (seen hanging 20+ minutes); consulted, never required, so a first
      # miss just pays normal install cost. Key rotates monthly;
      # restore-keys falls back to the newest prior month's cache on a miss.
      - name: Cache key date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore cached tippecanoe binary
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tippecanoe-bin
          key: tippecanoe-bin-${{ runner.os }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            tippecanoe-bin-${{ runner.os }}-

      # apt-get has no built-in bound on a stalled mirror, so give it explicit
      # timeouts/retries plus a step-level backstop, failing fast into the
      # source-build fallback instead of eating the job's runtime.
      - name: Install tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update \
            && sudo apt-get install -y tippecanoe || {
            git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -C /tmp/tippecanoe -j"$(nproc)"
            sudo make -C /tmp/tippecanoe install
          }
          mkdir -p ~/.cache/tippecanoe-bin
          cp "$(command -v tile-join)" ~/.cache/tippecanoe-bin/

      - name: Add tippecanoe to PATH
        run: echo "$HOME/.cache/tippecanoe-bin" >> "$GITHUB_PATH"

      - name: Merge this layer's shards into its final file
        env:
          ATTRIBUTION: ${{ inputs.attribution }}
          BASENAME: ${{ matrix.basename }}
        run: |
          tile-join --no-tile-size-limit \
            --attribution="$ATTRIBUTION" \
            -o "${BASENAME}.pmtiles" shards/*--"${BASENAME}".mbtiles

      - name: Summarize
        env:
          BASENAME: ${{ matrix.basename }}
        run: |
          SHARD_COUNT=$(find shards -name "*--${BASENAME}.mbtiles" | wc -l | tr -d ' ')
          SIZE=$(du -h "${BASENAME}.pmtiles" | cut -f1)
          {
            echo "### ${BASENAME} layer"
            echo "- shards merged: $SHARD_COUNT"
            echo "- output size: $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.basename }}-pmtiles
          path: ${{ matrix.basename }}.pmtiles

  # Only needs verify-complete, transitively covering record-timings too
  # (verify-complete already waits on it). merge never touches queue state,
  # so gating cleanup on it as well would just delay it for no reason; this
  # runs in parallel with merge instead.
  cleanup:
    needs: verify-complete
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tiledistillery
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tiledistillery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .tiledistillery/scripts/requirements.txt

      - name: Reset queue state for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .tiledistillery/scripts/cleanup_claims.py \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "${{ inputs.output_basename }}"
