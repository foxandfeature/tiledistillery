name: 'Set up pipeline scripts'
description: >
  Installs Python and this pipeline's own script dependencies. Assumes this
  pipeline's own repo is already checked out under `.tiledistillery/`.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pipeline script dependencies
      shell: bash
      run: pip install -r .tiledistillery/scripts/requirements.txt
