name: 'Claim and build Geofabrik regions'
description: >
  Pulls the tilemaker image and this pipeline's own scripts, then loops
  claiming leaf regions from the shared queue (see docs/ARCHITECTURE.md
  "Distribution" and "Locking") and building each with tilemaker, until the
  queue is exhausted or this job runs low on time. Used identically by
  _pipeline.yml's main build round and its top-up round. Assumes the caller
  repo is already checked out at the workspace root and this pipeline's own
  repo under `.tiledistillery/`. config/process/output_basename take one
  value each, or comma-separated lists matched 1:1 — building more than one
  layer this way claims a region once and downloads its .osm.pbf once,
  running tilemaker once per config against those same bytes (see
  docs/ARCHITECTURE.md "Distribution", the same optimization TileAlchemist
  applies to its own multi-profile runs).
inputs:
  config:
    description: 'Path(s), in the caller repo, to tilemaker JSON layer config(s): one value, or a comma-separated list matched 1:1 with process/output_basename.'
    required: true
  process:
    description: 'Path(s), in the caller repo, to tilemaker Lua process script(s), matched 1:1 with config/output_basename.'
    required: true
  output_basename:
    description: 'Base name(s) for the output .pmtiles file(s), matched 1:1 with config/process. Also the claim/timing-history scope key, taken verbatim — see docs/ARCHITECTURE.md "Locking".'
    required: true
  manifest:
    description: Path to the queue-manifest.json produced by the prepare job.
    required: false
    default: queue-manifest.json
  shards_dir:
    required: false
    default: shards
  ttl_seconds:
    description: Stale-claim TTL passed through to claim.py next.
    required: false
    default: "5400"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pipeline script dependencies
      shell: bash
      run: pip install -r .tiledistillery/scripts/requirements.txt

    - name: Pull tilemaker image
      shell: bash
      # ghcr.io/systemed/tilemaker is the project's own published image —
      # current tilemaker, not whatever's frozen in Ubuntu's universe repo
      # (Noble ships 2.4.0, pre-3.0's Lua API and missing since-fixed
      # crashes; see the incident that prompted this switch). ":master" is
      # the only tag the upstream publish workflow produces (no semver
      # tags — see its docker-publish job), so this floats with upstream's
      # own default branch rather than pinning to an immutable release;
      # accepted since upstream's master is actively maintained and this
      # replaces a pin to an *unmaintained* apt snapshot, not a maintained
      # one. Pulled once per worker job, reused for every region it claims
      # in its loop below (same "already warm" reasoning docs/ARCHITECTURE.md
      # gives for the tilemaker binary itself).
      run: docker pull ghcr.io/systemed/tilemaker:master

    - name: Claim and build regions until the queue is empty
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CONFIG: ${{ inputs.config }}
        PROCESS: ${{ inputs.process }}
        OUTPUT_BASENAME: ${{ inputs.output_basename }}
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.shards_dir }}"

        IFS=',' read -ra CONFIGS <<< "$CONFIG"
        IFS=',' read -ra PROCESSES <<< "$PROCESS"
        IFS=',' read -ra BASENAMES <<< "$OUTPUT_BASENAME"

        while true; do
          CLAIM_JSON=$(python .tiledistillery/scripts/claim.py next \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --state-branch state --output-basename "$OUTPUT_BASENAME" \
            --manifest "${{ inputs.manifest }}" --ttl-seconds "${{ inputs.ttl_seconds }}")

          CLAIMED=$(jq -r '.claimed' <<<"$CLAIM_JSON")
          if [ "$CLAIMED" != "true" ]; then
            echo "queue empty, worker exiting"
            break
          fi

          REGION_ID=$(jq -r '.region.id' <<<"$CLAIM_JSON")
          PBF_URL=$(jq -r '.region.pbf_url' <<<"$CLAIM_JSON")
          SAFE_NAME=$(tr '/' '_' <<<"$REGION_ID")

          echo "::group::${REGION_ID}"
          START=$(date +%s)
          set +e
          curl -fsSL "$PBF_URL" -o region.osm.pbf
          STATUS=$?

          # One fetch, every requested layer built against the same bytes
          # (see docs/ARCHITECTURE.md "Distribution" — the same fetch/build
          # split TileAlchemist uses for its own multi-profile runs). Each
          # config gets its own shard file, "<region>--<output_basename>.mbtiles",
          # so the merge job can later glob for just its own layer's shards.
          if [ "$STATUS" -eq 0 ]; then
            for i in "${!BASENAMES[@]}"; do
              # Store dir must live under the bind-mounted workspace, not
              # system /tmp (mktemp's default) — the container can only
              # see paths under /data (see the docker run below).
              STORE_DIR="$(mktemp -d -p .)"
              docker run --rm \
                --user "$(id -u):$(id -g)" \
                -v "$GITHUB_WORKSPACE:/data" -w /data \
                ghcr.io/systemed/tilemaker:master \
                --input region.osm.pbf \
                --output "${{ inputs.shards_dir }}/${SAFE_NAME}--${BASENAMES[$i]}.mbtiles" \
                --config "${CONFIGS[$i]}" --process "${PROCESSES[$i]}" \
                --store "$STORE_DIR"
              STATUS=$?
              rm -rf "$STORE_DIR"
              if [ "$STATUS" -ne 0 ]; then
                break
              fi
            done
          fi
          set -e
          rm -f region.osm.pbf
          END=$(date +%s)
          echo "::endgroup::"

          if [ "$STATUS" -eq 0 ]; then
            python .tiledistillery/scripts/claim.py done \
              --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --state-branch state --output-basename "$OUTPUT_BASENAME" \
              --region-id "$REGION_ID" \
              --duration-seconds "$((END - START))"
          else
            # A region is one atomic unit of work across every config built
            # together in this call: if any of them failed, the whole
            # region is retried (all configs again) rather than tracking
            # partial per-config success — simpler, and consistent with
            # regions (not configs) being the thing that gets claimed. Any
            # shard already written by a config that succeeded before a
            # later one failed must not survive into the shards artifact,
            # since this region is about to be marked failed, not done.
            rm -f "${{ inputs.shards_dir }}/${SAFE_NAME}--"*.mbtiles
            python .tiledistillery/scripts/claim.py failed \
              --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --state-branch state --output-basename "$OUTPUT_BASENAME" \
              --region-id "$REGION_ID" \
              --error "build failed (exit ${STATUS})"
          fi
        done
